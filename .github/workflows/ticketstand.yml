name: Ticketstand aktualisieren

# Holt montags die Ticketzahlen (nur verkaufte Tickets, keine Umsätze) aus der
# OneDrive-Datei, die die geplante Claude-Aufgabe schreibt, und trägt sie in
# index.html ein. Der Freigabelink liegt als Secret VVK_JSON_URL im Repository.

on:
  schedule:
    - cron: "15 7,8,11 * * 1"   # Montag, mehrere Versuche (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency: ticketstand

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ticketzahlen holen und index.html aktualisieren
        env:
          VVK_JSON_URL: ${{ secrets.VVK_JSON_URL }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, urllib.request

          url = os.environ.get("VVK_JSON_URL", "").strip()
          if not url:
              sys.exit("Secret VVK_JSON_URL fehlt")
          import urllib.parse
          basis = url.split("?")[0]
          kandidaten = [basis + "?download=1", url + ("&" if "?" in url else "?") + "download=1"]
          # SharePoint/OneDrive-Freigabelink (…/:u:/g/personal/<user>/<token>) → download.aspx
          m = re.match(r"(https://[^/]+)/:\w:/\w/(personal/[^/]+)/([^/?]+)", basis)
          if m:
              kandidaten.insert(0, f"{m.group(1)}/{m.group(2)}/_layouts/15/download.aspx?share={m.group(3)}")

          neu = None
          for i, k in enumerate(kandidaten, 1):
              try:
                  resp = urllib.request.urlopen(urllib.request.Request(
                      k, headers={"User-Agent": "Mozilla/5.0", "Accept": "*/*"}), timeout=60)
                  raw = resp.read().decode("utf-8-sig", "replace")
                  ziel = urllib.parse.urlparse(resp.geturl()).netloc
              except Exception as ex:
                  print(f"Variante {i}: Fehler {getattr(ex, 'code', '')} {type(ex).__name__}")
                  continue
              try:
                  neu = json.loads(raw)
                  print(f"Variante {i}: OK")
                  break
              except ValueError:
                  hinweis = "Microsoft-Anmeldung -> Link ist nicht für 'Jeder' freigegeben" if "login" in ziel else "kein JSON"
                  print(f"Variante {i}: {hinweis} (Ziel: {ziel}, Anfang: {raw[:60]!r})")
          if neu is None:
              sys.exit("Download fehlgeschlagen (siehe Varianten oben)")

          # Strenge Prüfung: nur Datum, KW und Ticketzahlen
          if not isinstance(neu, list) or not neu:
              sys.exit("Unerwartetes Format")
          for e in neu:
              if (not isinstance(e, dict) or set(e) != {"datum", "kw", "eventim", "reservix"}
                      or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", str(e["datum"]))
                      or not all(isinstance(e[k], int) and e[k] >= 0 for k in ("kw", "eventim", "reservix"))
                      or not 1 <= e["kw"] <= 53):
                  sys.exit(f"Ungültiger Eintrag: {e!r}")

          p = "index.html"
          html = open(p, encoding="utf-8").read()
          m = re.search(r'(<script id="vvk-data" type="application/json">)(.*?)(</script>)', html, re.S)
          if not m:
              sys.exit("vvk-data-Block nicht gefunden")

          # Bestehende Einträge behalten, OneDrive-Werte gewinnen bei gleicher KW
          daten = {(d["datum"][:4], d["kw"]): d for d in json.loads(m.group(2))}
          for e in neu:
              daten[(e["datum"][:4], e["kw"])] = e
          liste = sorted(daten.values(), key=lambda d: d["datum"])

          zeilen = ",\n".join(
              '  {"datum":"%s","kw":%d,"eventim":%d,"reservix":%d}'
              % (d["datum"], d["kw"], d["eventim"], d["reservix"]) for d in liste)
          html = html[:m.start(2)] + "\n[\n" + zeilen + "\n]\n" + html[m.end(2):]
          open(p, "w", encoding="utf-8").write(html)
          open(os.environ["GITHUB_ENV"], "a").write(f"KW={liste[-1]['kw']}\n")
          print("Neuester Stand:", liste[-1])
          EOF

      - name: Commit und Push
        run: |
          if git diff --quiet; then echo "Keine Änderung"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Ticketstand KW $KW"
          git push
